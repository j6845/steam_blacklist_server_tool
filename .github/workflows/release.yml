name: Release

# Push a tag like v1.0.0 to build the JAR and the Windows package (JAR + minimal Java runtime)
# and publish a GitHub release with both.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR and Windows package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          ./package.ps1 -Version $version

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "build/steam-blacklist-tool-$env:VERSION-windows.zip" `
            "build/steam-blacklist-tool-$env:VERSION.jar" `
            --title "$env:GITHUB_REF_NAME" `
            --generate-notes
